<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voyage Voyage Rally</title>
<style>
  :root { --bg:#2b2620; --panel:#3a332a; --text:#efe8dc; --accent:#d9a441; --sand:#c9a96a; }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family: system-ui, sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  #topbar { display:flex; gap:1rem; align-items:center; padding:.4rem .8rem; background:var(--panel); font-size:.9rem; }
  #topbar .spacer { flex:1; }
  #main { flex:1; display:flex; min-height:0; }
  #camera { flex:1; position:relative; min-width:0; }
  canvas { width:100%; height:100%; display:block; }
  .panel { width:280px; background:var(--panel); overflow-y:auto; padding:.5rem; font-size:.85rem; }
  #left { border-right:1px solid #555; }
  #right { border-left:1px solid #555; }
  .panel h3 { font-size:.8rem; text-transform:uppercase; color:var(--accent); margin:.5rem 0 .3rem; }
  .rule { border:1px solid #555; border-radius:4px; padding:.3rem; margin-bottom:.3rem; font-size:.75rem; }
  .rule .head { display:flex; justify-content:space-between; }
  .rule .on { color:#7c7; } .rule .off { color:#a66; }
  #chat { display:flex; flex-direction:column; gap:.2rem; }
  #chat .msg { font-size:.75rem; } #chat .pseudo { color:var(--accent); }
  #chatinput { width:100%; margin-top:.3rem; background:#241f19; color:var(--text); border:1px solid #555; padding:.3rem; border-radius:4px; }
  #standings li { list-style:none; padding:.15rem 0; font-size:.8rem; }
  button { background:var(--accent); color:#211b10; border:none; padding:.3rem .6rem; border-radius:4px; cursor:pointer; font-weight:600; }
  button.small { font-size:.7rem; padding:.15rem .4rem; }
  #joinbox { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(20,16,10,.85); }
  #joinbox form { display:flex; flex-direction:column; gap:.5rem; background:var(--panel); padding:1.5rem; border-radius:8px; }
  input, select { background:#241f19; color:var(--text); border:1px solid #555; padding:.35rem; border-radius:4px; }
  #fullscreen { position:absolute; inset:0; background:var(--bg); z-index:10; display:none; padding:1rem; }
  .hidden { display:none !important; }
  #events div { font-size:.72rem; padding:.1rem 0; border-bottom:1px solid #444; }
  @media (max-width:700px){ .panel{ width:100%; } #main{ flex-direction:column; } #left{display:none;} }
</style>
</head>
<body>
<div id="topbar">
  <span id="clock">--:--</span>
  <span id="day">Jour 1</span>
  <span id="weather">☀️</span>
  <span id="pos">0 km</span>
  <span class="spacer"></span>
  <span id="budget">💰 1000</span>
  <button id="btn-map">Carte</button>
  <button id="btn-planner">Planificateur</button>
</div>
<div id="main">
  <div id="left" class="panel">
    <h3>Planificateur — canaux</h3>
    <div id="rules"></div>
  </div>
  <div id="camera"><canvas id="cv"></canvas></div>
  <div id="right" class="panel">
    <h3>Classement</h3>
    <ol id="standings"></ol>
    <h3>Journal de course</h3>
    <div id="events" style="max-height:30%; overflow-y:auto;"></div>
    <h3>Chat</h3>
    <div id="chat" style="max-height:25%; overflow-y:auto;"></div>
    <input id="chatinput" placeholder="Message…">
  </div>
</div>
<div id="joinbox">
  <form id="joinform">
    <h2>Voyage Voyage Rally</h2>
    <input id="f_pseudo" placeholder="Pseudo" required>
    <input id="f_code" placeholder="Code d'accès" required>
    <input id="f_color" type="color" value="#cc3333">
    <button type="submit">Rejoindre la course</button>
  </form>
</div>
<div id="fullscreen">
  <button id="btn-close" class="small">✕ Fermer</button>
  <div id="fscontent"></div>
</div>
<script src="/app.js"></script>
</body>
</html>
