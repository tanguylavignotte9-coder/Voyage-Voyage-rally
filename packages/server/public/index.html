<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voyage Voyage Rally</title>
<style>
  :root { --bg:#2b2620; --panel:#3a332a; --text:#efe8dc; --accent:#d9a441; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  #topbar { display:flex; gap:.8rem; align-items:center; padding:.4rem .8rem; background:var(--panel); font-size:.9rem; flex-wrap:wrap; }
  #topbar .spacer { flex:1; }
  #main { flex:1; display:flex; min-height:0; }
  #camera { flex:1; position:relative; min-width:0; }
  canvas#cv { width:100%; height:100%; display:block; }
  .panel { width:280px; background:var(--panel); overflow-y:auto; padding:.5rem; font-size:.85rem; }
  #left { border-right:1px solid #555; }
  #right { border-left:1px solid #555; }
  .panel h3 { font-size:.8rem; text-transform:uppercase; color:var(--accent); margin:.5rem 0 .3rem; }
  .rule { border:1px solid #555; border-radius:4px; padding:.3rem; margin-bottom:.3rem; font-size:.75rem; }
  .rule .head { display:flex; justify-content:space-between; align-items:center; }
  .on { color:#7c7; font-weight:bold; } .off { color:#a66; font-weight:bold; }
  .g { margin:.25rem 0; font-size:.75rem; }
  .g span { display:inline-block; width:110px; }
  .bar { display:inline-block; width:140px; height:10px; background:#241f19; border-radius:5px; vertical-align:middle; }
  .fill { height:100%; border-radius:5px; }
  #chat .msg { font-size:.75rem; margin:.1rem 0; } #chat .pseudo { color:var(--accent); }
  #chatinput { width:100%; margin-top:.3rem; background:#241f19; color:var(--text); border:1px solid #555; padding:.3rem; border-radius:4px; }
  #standings li { list-style:none; padding:.15rem 0; font-size:.8rem; }
  button { background:var(--accent); color:#211b10; border:none; padding:.3rem .6rem; border-radius:4px; cursor:pointer; font-weight:600; margin:.1rem; }
  button.small { font-size:.7rem; padding:.1rem .35rem; }
  #joinbox { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(20,16,10,.85); z-index:5; }
  #joinbox form { display:flex; flex-direction:column; gap:.5rem; background:var(--panel); padding:1.5rem; border-radius:8px; }
  #joinbox h2 { color:var(--accent); }
  input, select { background:#241f19; color:var(--text); border:1px solid #555; padding:.35rem; border-radius:4px; }
  #errline { color:#e88; font-size:.75rem; min-height:1em; }
  #fullscreen { position:absolute; inset:0; background:var(--bg); z-index:10; display:none; flex-direction:column; padding:1rem; }
  #fscontent { flex:1; overflow:auto; }
  #fscontent table { border-collapse:collapse; margin:.5rem 0; }
  #fscontent td, #fscontent th { border:1px solid #555; padding:.3rem .5rem; font-size:.8rem; text-align:left; }
  .hidden { display:none !important; }
  #events div { font-size:.72rem; padding:.1rem 0; border-bottom:1px solid #444; }
  #mental div { font-size:.75rem; font-style:italic; color:#cdb; padding:.15rem 0; }
  #paused { position:absolute; top:0; left:0; right:0; background:#a33; color:#fff; text-align:center; padding:.3rem; font-weight:bold; z-index:4; }
  @media (max-width:700px){ .panel{ width:100%; } #main{ flex-direction:column; } #left{ display:none; } }
</style>
</head>
<body>
<div id="topbar">
  <span id="clock">--:--</span>
  <span id="day">Jour 1</span>
  <span id="pos">0 km</span>
  <span class="spacer"></span>
  <span id="budget">💰 —</span>
  <button id="btn-map">🗺️ Carte</button>
  <button id="btn-planner">📋 Planificateur</button>
  <button id="btn-results" class="hidden">🏁 Résultats</button>
</div>
<div id="paused" class="hidden">⏸ Course en pause — vous pouvez éditer vos règles</div>
<div id="main">
  <div id="left" class="panel">
    <h3>Jauges vitales</h3>
    <div id="gauges"></div>
    <div id="actions"></div>
    <h3>Journal mental</h3>
    <div id="mental"></div>
  </div>
  <div id="camera">
    <canvas id="cv"></canvas>
    <div id="joinbox">
      <form id="joinform">
        <h2>🏁 Voyage Voyage Rally</h2>
        <input id="f_pseudo" placeholder="Pseudo" required>
        <input id="f_code" placeholder="Code d'accès à la course" required>
        <label>Couleur de votre voiture : <input id="f_color" type="color" value="#cc3333"></label>
        <button type="submit">Rejoindre la course</button>
        <div id="errline"></div>
      </form>
    </div>
    <div id="fullscreen">
      <button id="btn-close" class="small">✕ Fermer</button>
      <div id="fscontent"></div>
    </div>
  </div>
  <div id="right" class="panel">
    <h3>Classement (compensé)</h3>
    <ol id="standings"></ol>
    <div id="challenges"></div>
    <h3>Journal de course</h3>
    <div id="events" style="max-height:25%; overflow-y:auto;"></div>
    <h3>Chat</h3>
    <div id="chat" style="max-height:22%; overflow-y:auto;"></div>
    <input id="chatinput" placeholder="Message…">
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
